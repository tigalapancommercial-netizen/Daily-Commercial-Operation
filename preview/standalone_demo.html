const env={VITE_DEMO_MODE:'true'};
const endpoint=env.VITE_SUPABASE_URL||'';
const key=env.VITE_SUPABASE_PUBLISHABLE_KEY||'';
const isDemo=env.VITE_DEMO_MODE==='true'||!endpoint||!key;
let supabase=null;
let demoData=seedDemo();
const demoProfile={id:'demo',display_name:'Executive Preview',role:'master',store_id:null};

async function start(){
 if(isDemo)return {profile:demoProfile,mode:'demo'};
 const {createClient}=await import('@supabase/supabase-js');
 supabase=createClient(endpoint,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data:{session},error}=await supabase.auth.getSession();
 if(error)throw error;
 if(!session)return {profile:null,mode:'live'};
 return {profile:await getProfile(session.user.id),mode:'live'};
}
async function login(email,password){
 if(isDemo)return demoProfile;
 const {data,error}=await supabase.auth.signInWithPassword({email,password});
 if(error)throw error;
 return getProfile(data.user.id);
}
async function logout(){if(!isDemo)await supabase.auth.signOut();}
async function getProfile(userId){
 const {data,error}=await supabase.from('profiles').select('id,display_name,role,store_id').eq('id',userId).single();
 if(error)throw error;
 return data;
}
async function loadAll(profile){
 if(isDemo)return structuredClone(demoData);
 const configs=[
  ['briefings','briefings','briefing_date'],['issues','issues','created_at'],['schedules','visit_schedules','visit_date'],
  ['visits','visits','visit_date'],['checklists','checklist_entries','check_date'],['dso','dso_reports','report_date']
 ];
 const all=await Promise.all(configs.map(async ([key,table,col])=>{
  const {data,error}=await supabase.from(table).select('*').order(col,{ascending:false}).limit(500);
  if(error)throw new Error(`${table}: ${error.message}`);
  return [key, data||[]];
 }));
 return Object.fromEntries(all);
}
async function saveIssue(item){
 if(isDemo){const now=new Date().toISOString();const record={...item,id:item.id||crypto.randomUUID(),updated_at:now};const ix=demoData.issues.findIndex(x=>x.id===record.id);if(ix===-1)demoData.issues.unshift(record);else demoData.issues[ix]=record;return record;}
 const input={...item};delete input.store_name;
 const {data,error}=item.id?await supabase.from('issues').update(input).eq('id',item.id).select().single():await supabase.from('issues').insert(input).select().single();
 if(error)throw error;return data;
}
async function saveBriefing(entry){
 if(isDemo){const ix=demoData.briefings.findIndex(x=>x.store_id===entry.store_id&&x.briefing_date===entry.briefing_date&&x.shift===entry.shift);if(ix>=0)demoData.briefings[ix]={...demoData.briefings[ix],...entry};else demoData.briefings.push({...entry,id:crypto.randomUUID()});return entry;}
 const {data,error}=await supabase.from('briefings').upsert(entry,{onConflict:'store_id,briefing_date,shift'}).select().single();
 if(error)throw error;return data;
}
async function saveSchedule(entry){
 if(isDemo){demoData.schedules.unshift({...entry,id:crypto.randomUUID()});return entry;}
 const {data,error}=await supabase.from('visit_schedules').insert(entry).select().single();
 if(error)throw error;return data;
}
async function saveVisit(entry){
 if(isDemo){demoData.visits.unshift({...entry,id:crypto.randomUUID()});return entry;}
 const {data,error}=await supabase.from('visits').insert(entry).select().single();
 if(error)throw error;return data;
}
async function toggleChecklist(entry){
 const status=entry.status==='Selesai'?'Belum':'Selesai';
 if(isDemo){const c=demoData.checklists.find(x=>x.id===entry.id);if(c)c.status=status;return status;}
 const {error}=await supabase.from('checklist_entries').update({status,completed_at:status==='Selesai'?new Date().toISOString():null}).eq('id',entry.id);
 if(error)throw error;return status;
}
async function updateIssueStatus(id,status){
 if(isDemo){const x=demoData.issues.find(x=>x.id===id);if(x){x.status=status;x.progress=status==='Selesai'?100:x.progress;}return;}
 const {error}=await supabase.from('issues').update({status,...(status==='Selesai'?{progress:100}:{} )}).eq('id',id);
 if(error)throw error;
}

function compliancePanel(){const scope=storesInScope(),sub=submitted();const body=`<div class="matrix">${scope.map(s=>{const done=sub.has(s.id);const entries=dayBriefings().filter(b=>b.store_id===s.id);const nihil=entries.length>0&&entries.every(b=>b.no_findings);return `<div class="matrix-card"><div><b>${esc(s.name)}</b><small>${esc(s.region)} · ${nihil?'NIHIL temuan':entries.length?`${entries.length} sesi briefing`:'Belum ada input'}</small></div><span class="pill ${done?'done':'overdue'}">${done?'Sudah':'Belum'}</span></div>`}).join('')}</div>`;
return panel('Kepatuhan briefing per toko','NIHIL dihitung sebagai laporan yang sudah diinput',body,'<button class="btn small primary" data-action="open-briefing">＋ Catat Briefing</button>');}
function sortedIssues(arr){return [...arr].sort((a,b)=>Number(isOverdue(b))-Number(isOverdue(a))||PRIORITIES.indexOf(a.priority)-PRIORITIES.indexOf(b.priority));}
function issuesTable(list,compact=false){const results=sortedIssues(list.filter(i=>(state.status==='all'||i.status===state.status)&&(!state.search||`${i.title} ${i.pic_name||''} ${storeName(i.store_id)}`.toLowerCase().includes(state.search.toLowerCase()))));const rows=results.map(i=>`<tr><td><div class="table-title" title="${esc(i.title)}">${esc(i.title)}</div><span class="mild">${esc(i.category||'Lainnya')}</span></td><td>${esc(shortName(storeName(i.store_id)))}</td><td>${prio(i.priority)}</td><td>${esc(i.pic_name||'Belum ditentukan')}</td><td class="${isOverdue(i)?'text-red':''}">${prettyDate(i.due_date)}</td><td>${issueStatus(i.status)}</td><td><div class="progress"><i style="width:${Math.min(100,Number(i.progress)||0)}%"></i></div><small>${Number(i.progress)||0}%</small></td><td><button class="btn small" data-edit="${esc(i.id)}">Edit</button></td></tr>`).join('');
return panel(compact?'Daftar action & tindak lanjut':'Action plan seluruh toko',`${results.length} issue sesuai filter aktif`,`<div class="table-wrap"><table class="data-table"><thead><tr><th>Temuan</th><th>Toko</th><th>Prioritas</th><th>PIC</th><th>Due Date</th><th>Status</th><th>Progres</th><th>Aksi</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Belum ada data sesuai filter</td></tr>'}</tbody></table></div>`,`<button class="btn small" data-action="export">↓ CSV</button>`);}
function pageIssues(pending=false){const list=filteredIssues().filter(i=>!pending||i.origin==='visit');const open=list.filter(nonClosed),overdue=open.filter(isOverdue);return head(pending?'Pending Matter':'Action Plan & Issues',pending?'Seluruh temuan dari visit, baik yang belum selesai maupun sudah selesai.':'Satu daftar masalah, solusi, PIC, dan due date seluruh toko.',`<button class="btn outline" data-action="export">↓ Export CSV</button><button class="btn primary" data-action="open-issue">＋ Tambah Issue</button>`)
+`<div class="grid-kpis">${metric('Seluruh issue',list.length,'Hasil data aktif','▤')}${metric('Masih terbuka',open.length,'Open / On Progress / Pending','◷')}${metric('Overdue',overdue.length,'Perlu eskalasi','⚠','danger')}${metric('Sudah selesai',list.filter(i=>i.status==='Selesai').length,'Menunggu validasi bila perlu','✓','good')}</div>`
+`<div class="toolbar"><div class="field wide"><label>Cari temuan atau PIC</label><input id="issueSearch" placeholder="Cari masalah, toko, atau PIC…" value="${esc(state.search)}"></div><div class="field"><label>Status</label><select id="issueStatus"><option value="all">Semua status</option>${STATUSES.map(s=>`<option ${state.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Toko</label><select id="storeFilter">${getStoreSelect(state.store)}</select></div><button class="btn primary" data-action="apply-issues">Terapkan</button></div>${issuesTable(list)}`;}
function pageCompliance(){const sub=submitted(),scope=storesInScope();return head('Kepatuhan Toko','Lihat toko yang sudah briefing, belum input, serta kelengkapan assignment.',`<button class="btn outline" data-action="export">↓ CSV</button><button class="btn primary" data-action="open-briefing">＋ Input Briefing</button>`)+filters()+`<div class="grid-kpis">${metric('Sudah briefing',scope.filter(s=>sub.has(s.id)).length,'Sudah tercatat termasuk NIHIL','✓','good')}${metric('Belum briefing',scope.filter(s=>!sub.has(s.id)).length,'Perlu pengingat','◷','danger')}${metric('Sesi briefing',dayBriefings().length,'Sesi pada tanggal terpilih','📣')}${metric('Nihil temuan',dayBriefings().filter(b=>b.no_findings).length,'Tidak ada masalah, tetap tercatat','◉')}</div>`+compliancePanel();}

function pageDSO(){const arr=state.data.dso.filter(x=>inScope(x.store_id));const forms=['OPENING','DURING','CLOSING','LAMPU'];return head('Daily Store Operation','Report operasional, status pengiriman, dan foto bukti berdasarkan sesi.',`<button class="btn outline" data-action="export">↓ CSV</button>`)+filters()+`<div class="grid-kpis">${metric('Total laporan',arr.length,'Pada data yang diambil','▣')}${metric('Approved',arr.filter(x=>x.status==='Approved').length,'Validasi selesai','✓','good')}${metric('Submitted',arr.filter(x=>x.status==='Submitted').length,'Menunggu validasi','◷')}${metric('Form standar',forms.length,'Opening · During · Closing · Lampu','📷')}</div>`+panel('Status form per toko','Format dan titik foto berasal dari template aplikasi v7.',`<div class="matrix">${storesInScope().map(s=>{const todays=arr.filter(x=>x.store_id===s.id&&x.report_date===state.date);return `<div class="matrix-card"><div><b>${esc(s.name)}</b><small>${todays.length} / ${forms.length} form terkirim</small></div><span class="pill ${todays.length===4?'done':todays.length?'progress':'pending'}">${todays.length===4?'Lengkap':todays.length?'Sebagian':'Belum'}</span></div>`}).join('')}</div>`);}
function pageSchedule(){const entries=state.data.schedules.filter(x=>inScope(x.store_id));const anchor=new Date(`${state.date}T12:00:00+08:00`);const weekday=(anchor.getUTCDay()+6)%7;const monday=new Date(anchor);monday.setUTCDate(anchor.getUTCDate()-weekday);const days=Array.from({length:7},(_,i)=>{const date=new Date(monday);date.setUTCDate(monday.getUTCDate()+i);return dateWita(date)});return head('Jadwal Visit','Kelola jadwal kunjungan SPV dengan tampilan mingguan dan daftar terukur.',`<button class="btn outline" data-action="export">↓ CSV</button><button class="btn primary" data-action="open-schedule">＋ Jadwalkan Visit</button>`)+filters()+`<div class="grid-kpis">${metric('Jadwal terdata',entries.length,'Seluruh tanggal dalam data','▦')}${metric('Hari ini',entries.filter(x=>x.visit_date===state.date||x.date===state.date).length,'Jadwal pada tanggal terpilih','◉')}${metric('Dalam rencana',entries.filter(x=>x.status==='Rencana').length,'Belum dilaksanakan','◷')}${metric('Selesai',entries.filter(x=>x.status==='Selesai').length,'Aktivitas tercatat','✓','good')}</div>`+panel('Kalender kunjungan — 7 hari',`${prettyDate(days[0])} sampai ${prettyDate(days[6])}`,`<div class="calendar">${days.map((d,i)=>{const today=d===state.date;const dayItems=entries.filter(x=>(x.visit_date||x.date)===d);return `<div class="day-card ${today?'today':''}"><h4>${['Sen','Sel','Rab','Kam','Jum','Sab','Min'][i]}<strong>${d.slice(8)}</strong></h4>${dayItems.map(x=>`<div class="visit-chip"><b>${esc(shortName(storeName(x.store_id)))}</b><small>${esc(x.start_time||'09:00')} · ${esc(x.pic_name||'SPV')}</small></div>`).join('')||'<span class="mild" style="font-size:10px">—</span>'}</div>`}).join('')}</div>`);

function scoreTable(){const data=storesInScope().map(s=>{const a=filteredIssues().filter(i=>i.store_id===s.id);const d=a.filter(i=>i.status==='Selesai').length;const br=dayBriefings().some(b=>b.store_id===s.id);return {s,total:a.length,done:d,pct:a.length?Math.round(d/a.length*100):null,br};}).sort((a,b)=>(b.pct??-1)-(a.pct??-1));return panel('Scorecard per toko','Dasar awal: tingkat penyelesaian issue dan briefing hari terpilih.',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Toko</th><th>Issue</th><th>Closed</th><th>Completion</th><th>Briefing hari ini</th></tr></thead><tbody>${data.map(x=>`<tr><td><strong>${esc(x.s.name)}</strong></td><td>${x.total}</td><td>${x.done}</td><td>${x.pct??'—'}${x.pct==null?'':'%'}</td><td><span class="pill ${x.br?'done':'overdue'}">${x.br?'Sudah':'Belum'}</span></td></tr>`).join('')}</tbody></table></div>`);}

function field(name,label,content,full=false){return `<div class="field ${full?'form-full':''}"><label for="${name}">${label}</label>${content}</div>`;}
function renderModal(type){let title='',fields='';
 if(type==='issue'){
  const i=state.editing||{};title=i.id?'Edit Issue':'Tambah Issue / Action Plan';fields=field('store_id','Toko',`<select name="store_id" required>${active().map(s=>`<option value="${s.id}" ${i.store_id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`)+field('priority','Prioritas',`<select name="priority">${PRIORITIES.map(v=>`<option ${v===(i.priority||'Sedang')?'selected':''}>${v}</option>`).join('')}</select>`)+field('title','Masalah / Temuan',`<textarea name="title" required minlength="5">${esc(i.title||'')}</textarea>`,true)+field('root_cause','Akar penyebab',`<textarea name="root_cause">${esc(i.root_cause||'')}</textarea>`,true)+field('action_plan','Solusi / Action Plan',`<textarea name="action_plan" required>${esc(i.action_plan||'')}</textarea>`,true)+field('pic_name','PIC',`<input name="pic_name" value="${esc(i.pic_name||'')}" required>`)+field('due_date','Due Date',`<input name="due_date" type="date" value="${i.due_date||''}" required>`)+field('status','Status',`<select name="status">${STATUSES.map(v=>`<option ${v===(i.status||'Open')?'selected':''}>${v}</option>`).join('')}</select>`)+field('origin','Asal temuan',`<select name="origin"><option value="briefing" ${(i.origin||'briefing')==='briefing'?'selected':''}>Briefing</option><option value="visit" ${i.origin==='visit'?'selected':''}>Visit</option></select>`);
 }else if(type==='briefing'){
  title='Catat Briefing Harian';fields=field('store_id','Toko',`<select name="store_id">${allowedOptions}</select>`)+field('briefing_date','Tanggal',`<input type="date" name="briefing_date" value="${state.date}" required>`)+field('shift','Sesi',`<select name="shift"><option>Pagi</option><option>Siang</option><option>Sore</option><option>Malam</option></select>`)+field('leader','Pemimpin briefing',`<input name="leader" placeholder="Nama pemimpin" required>`)+field('participants','Jumlah peserta',`<input name="participants" type="number" min="0" value="0">`)+field('no_findings','Hasil',`<select name="no_findings"><option value="true">NIHIL temuan</option><option value="false">Ada temuan (input melalui Action Plan)</option></select>`,true);
 }else if(type==='schedule'){

 }else if(type==='visit'){
  title='Catat Visit';fields=field('store_id','Toko',`<select name="store_id">${allowedOptions}</select>`)+field('visit_date','Tanggal Visit',`<input name="visit_date" type="date" value="${state.date}" required>`)+field('evaluator_name','Evaluator / SPV',`<input name="evaluator_name" required>`)+field('score','Nilai Akhir (%)',`<input name="score" type="number" min="0" max="100" placeholder="0–100">`)+field('status','Status',`<select name="status"><option>Open</option><option>On Progress</option><option>Selesai</option></select>`)+field('notes','Ringkasan',`<textarea name="notes" placeholder="Catatan hasil visit"></textarea>`,true)+`<div class="form-full callout">Foto per point, checklist detail, dan penambahan banyak issue dalam satu visit adalah tahap integrasi lanjutan dari data VISIT_DEF dan VISIT_ISSUE v7.</div>`;
 }
 return `<div class="modal-backdrop" data-action="modal-backdrop"><form class="modal" id="modalForm" data-form="${type}"><div class="modal-head"><h3>${title}</h3><button type="button" class="circle-btn" data-action="modal-close">×</button></div><div class="modal-body">${fields}</div><div class="modal-footer"><button type="button" class="btn" data-action="modal-close">Batal</button><button class="btn primary" type="submit" ${state.busy?'disabled':''}>${state.busy?'Menyimpan…':'Simpan data'}</button></div></form></div>`;

function csvCell(x){let s=String(x??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function csvDownload(rows,name){if(!rows.length){notify('Tidak ada data untuk diekspor.',true);return;}const keys=Object.keys(rows[0]);const contents=[keys.join(','),...rows.map(r=>keys.map(k=>csvCell(r[k])).join(','))].join('\r\n');const blob=new Blob(['\ufeff',contents],{type:'text/csv;charset=utf-8;'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);}
function exportCurrent(){
 const filtered=(arr)=>arr.filter(x=>inScope(x.store_id));
 let rows=[];
 if(['overview','issues','pending'].includes(state.page)){
  rows=sortedIssues(filteredIssues().filter(x=>(state.page!=='pending'||x.origin==='visit')&&(state.status==='all'||x.status===state.status)&&(!state.search||`${x.title||''} ${x.pic_name||''} ${storeName(x.store_id)}`.toLowerCase().includes(state.search.toLowerCase()))));
 }else if(state.page==='compliance')rows=storesInScope().map(s=>({toko:s.name,tanggal:state.date,status:submitted().has(s.id)?'Sudah':'Belum'}));
 else if(state.page==='schedule')rows=filtered(state.data.schedules);
 else if(state.page==='visits')rows=filtered(state.data.visits);
 else if(state.page==='checklist')rows=filtered(state.data.checklists).filter(c=>c.check_date===state.date);
 else if(state.page==='dso')rows=filtered(state.data.dso).filter(d=>d.report_date===state.date);
 else if(state.page==='scorecard')rows=storesInScope().map(s=>({toko:s.name,issues:filteredIssues().filter(i=>i.store_id===s.id).length}));
 csvDownload(rows,`assignment_${state.page}_${state.date}.csv`);
}

async function reload(){try{state.data=await loadAll(state.profile);render();}catch(e){notify('Gagal memuat data: '+e.message,true);}}
function navigate(page){state.page=page;state.sidebar=false;state.search='';state.status='all';state.subTab='ringkasan';render();window.scrollTo({top:0,behavior:'instant'});}
function openModal(type,item){state.modal=type;state.editing=item||null;render();}
async function handleForm(form){const fd=new FormData(form);const d=Object.fromEntries(fd.entries());const kind=form.dataset.form;try{state.busy=true;form.querySelector('[type="submit"]').disabled=true;let msg='Data tersimpan';if(kind==='issue'){
 const item={...d,priority:d.priority||'Sedang',status:d.status||'Open',progress:state.editing?.progress||0,origin:d.origin||'briefing',due_date:d.due_date||null};
 if(state.editing?.id)item.id=state.editing.id;await saveIssue(item);msg='Issue berhasil disimpan';
 }else if(kind==='briefing'){await saveBriefing({...d,participants:Number(d.participants)||0,no_findings:d.no_findings==='true'});msg='Briefing tercatat';}
 else if(kind==='schedule'){if(d.end_time<=d.start_time)throw new Error('Jam selesai harus lebih akhir dari jam mulai');await saveSchedule(d);msg='Jadwal visit tersimpan';}
 else if(kind==='visit'){await saveVisit({...d,score:d.score?Number(d.score):null});msg='Visit tersimpan';}
 state.busy=false;state.modal=null;state.editing=null;await reload();notify(msg);}
 catch(e){state.busy=false;notify(e.message||String(e),true);render();}}
async function handleAction(ev){const btn=ev.target.closest('[data-page],[data-subtab],[data-action],[data-edit],[data-toggle-check]');if(!btn)return;
 if(btn.dataset.page){navigate(btn.dataset.page);return;}
 if(btn.dataset.subtab){state.subTab=btn.dataset.subtab;render();return;}
 if(btn.dataset.edit){const item=state.data.issues.find(i=>i.id===btn.dataset.edit);openModal('issue',item);return;}
 if(btn.dataset.toggleCheck){const row=state.data.checklists.find(x=>x.id===btn.dataset.toggleCheck);if(!row)return;try{await toggleChecklist(row);await reload();}catch(e){notify(e.message,true);}return;}
 const a=btn.dataset.action;
 if(a==='modal-close'||a==='modal-backdrop'&&ev.target===btn){state.modal=null;state.editing=null;render();return;}
 if(a==='sidebar-close'){state.sidebar=false;render();return;}
 if(a==='sidebar-toggle'){state.sidebar=!state.sidebar;render();return;}
 if(a==='reload'){await reload();notify('Data diperbarui');return;}
 if(a==='apply'||a==='apply-issues'){
  state.date=$('monitorDate')?.value||state.date;state.store=$('storeFilter')?.value||state.store;state.brand=$('brandFilter')?.value||state.brand;
  state.status=$('issueStatus')?.value||'all';state.search=$('issueSearch')?.value?.trim()||'';render();return;
 }
 if(a==='export'){exportCurrent();return;}
 if(a==='open-issue'){openModal('issue');return;}
 if(a==='open-briefing'){openModal('briefing');return;}
 if(a==='open-schedule'){openModal('schedule');return;}
 if(a==='open-visit'){openModal('visit');return;}
 if(a==='logout'){await logout();state.profile=null;render();return;}
}
